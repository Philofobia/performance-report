# Global application settings — thresholds, model choices, run defaults.
# Loaded/validated by config/load.py (pydantic). See docs/PROJECT_SPEC.md §9.
run_defaults:
  # Default run count when a condition omits `runs`.
  runs: 3
  # Single-mode default device/network (used when a page has no explicit tests).
  device: mid-mobile
  network: slow-4g
  # "One mobile + one desktop per page" default conditions (PROJECT_SPEC §4.4).
  mobile_device: mid-mobile
  mobile_network: slow-4g
  desktop_device: desktop
  desktop_network: fast-3g

timeouts:
  # Per-navigation budgets for the browser runner (ms).
  # A heavy commerce page under CPU *and* network throttling, with HAR and
  # trace recording active, can need well over the 30s default to fire `load`
  # — the Oakley PDP does. navigation_ms expiring is fatal (nothing loaded, so
  # there is nothing to measure); network_idle_ms expiring is not, because
  # `load` has already fired and idle is only a settle window.
  navigation_ms: 90000
  network_idle_ms: 15000
  lcp_ms: 5000
  inp_ms: 1000

thresholds:
  # CWV "good" thresholds (ms) — LCP / INP.
  lcp_good_ms: 2500
  lcp_fail_ms: 4000
  cls_good: 0.1
  cls_fail: 0.25
  inp_good_ms: 200
  inp_fail_ms: 500
  fcp_good_ms: 1800
  ttfb_good_ms: 800

models:
  # text-embedding-004 was retired by Google — the API now answers it with
  # 404 NOT_FOUND for embedContent. gemini-embedding-001 is the stable
  # replacement. Changing this invalidates the embedding cache (it is keyed by
  # content, not by model), so re-index after switching.
  embeddings: gemini-embedding-001
  llm: gemini-2.0-flash
  embed_dimensions: 768

rag:
  top_k: 5

storage:
  sqlite_path: data/processed/runs.sqlite
  vector_dir: data/vector
  raw_dir: data/raw

report:
  output_dir: data/reports
  appendix:
    # How many requests the per-capture table shows, largest transfer first.
    # The true total is always stated beside the table, so this truncates the
    # listing without ever misrepresenting the capture.
    top_requests: 15
    # Screenshots are downscaled before embedding; a full-page mobile capture
    # is otherwise several MB of base64 per entry.
    screenshot_width_px: 720
    # Beyond this height the image is cropped from the top, and the caption
    # says so.
    screenshot_max_height_px: 1600

trends:
  # Campaign-over-campaign comparison. A change smaller than this reads as
  # "flat" — emulated throttling varies run to run, and without a dead band a
  # 3% wobble would be reported as a regression every campaign.
  dead_band_pct: 5.0
  # How many campaigns a trend series shows, newest last. Minimum 2.
  window: 5
