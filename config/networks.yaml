# Network / throttling presets mirroring Chrome DevTools tiers (PROJECT_SPEC §4.4).
# Applied via CDP Network.emulateNetworkConditions (latency + downlink/uplink).
# `downlink_mbps`/`uplink_mbps` of `null` mean "unthrottled". `offline` forces offline.
networks:
  - name: online
    label: No throttling (online)
    latency_ms: 0
    downlink_mbps: null
    uplink_mbps: null
    offline: false
  - name: fast-3g
    label: Fast 3G (DevTools)
    latency_ms: 150
    downlink_mbps: 1.6
    uplink_mbps: 0.75
    offline: false
  # Lighthouse's desktop throttling (rttMs 40, throughputKbps 10240). The
  # desktop default: fast-3g put a working 1 MB hero at 12 s of LCP on the
  # Oakley homepage - true for a 1.6 Mbps link, not for desktop visitors, whom
  # WebPageTest (20 Mbps) and the field both put at ~2 s.
  - name: lighthouse-desktop
    label: Lighthouse desktop (10 Mbps, 40 ms)
    latency_ms: 40
    downlink_mbps: 10.0
    uplink_mbps: 10.0
    offline: false
  - name: slow-4g
    label: Slow 4G (DevTools)
    latency_ms: 170
    downlink_mbps: 4.0
    uplink_mbps: 3.0
    offline: false
  - name: slow-3g
    label: Slow 3G (DevTools)
    latency_ms: 200
    downlink_mbps: 0.4
    uplink_mbps: 0.4
    offline: false
  - name: offline
    label: Offline
    latency_ms: 0
    downlink_mbps: 0
    uplink_mbps: 0
    offline: true
  - name: custom
    label: Custom throttle template
    latency_ms: 100
    downlink_mbps: 10.0
    uplink_mbps: 5.0
    offline: false
